<div class="container">
  <nz-card>
    <div class="card-title">Upcoming Deadlines</div>
    <div class="upcoming-deadlines-content">
      @for (project of upcomingProjectsDeadline(); track project) {
      <span>{{ project.projectName }} - {{ project.dueDate | date:'MMM dd, yyyy'}}</span>
      }
    </div>
  </nz-card>
</div>
