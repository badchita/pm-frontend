<div class="timeline-container">
  <app-error-alert [error]="catchError"></app-error-alert>
  <nz-timeline nzMode="left">
    @for (history of taskHistories; track history) {
    <nz-timeline-item [nzLabel]="history.label" [nzColor]="history.color">Val Ryan bachita <br />
      <i class="history-date">{{ history.changedAt | date: 'MMM dd, yyy' }}</i>
    </nz-timeline-item>
    }
  </nz-timeline>
</div>
