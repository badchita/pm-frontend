<nz-spin [nzSpinning]="isLoading" [nzTip]="spinnerTip">
  <div class="container">
    <div class="header">
      <span>{{ projectName }}: {{ projectIdNumber }}</span>
    </div>

    <app-error-alert [error]="catchError"></app-error-alert>

    <div class="task-button-container">
      <button nz-button nzShape="round" nzType="primary" (click)="addNewTask()">
        Add New Task
      </button>
    </div>
    <div class="board" cdkDropListGroup #board>
      @for (column of columns; track column.state) {
      <div class="column" cdkDropList [cdkDropListData]="column.tasks"
        (cdkDropListDropped)="onDrop($event, column.state)" [style.--column-color]="column.color">
        <h3>{{ column.label }}</h3>

        @for (task of column.tasks; track task.id) {
        <div class="task-board-task" cdkDrag (cdkDragMoved)="onDragMoved($event)" (cdkDragEnded)="onDragEnded()">
          <nz-card nzSize="small" nzHoverable>
            <nz-card-meta [nzTitle]="taskCardTitle" [nzDescription]="taskCardDescription"></nz-card-meta>
            <ng-template #taskCardTitle>
              <span>{{ task.taskIdNumber }} </span>
              <a class="task-name" (click)="navigateToEditTask(task.projectId, task.id)">{{ task.taskName }}</a>
            </ng-template>
            <ng-template #taskCardDescription>
              <div class="assign-to-container">
                <nz-icon nzType="user" nzTheme="outline"></nz-icon>
                @if (task.assignedTo) {
                <span>{{ task.assignedTo }}</span>
                } @else {
                <span>No one selected</span>
                }
              </div>
              <nz-tag [nzColor]="task.stateColor">{{ task.stateLabel }}</nz-tag>
            </ng-template>
          </nz-card>
        </div>
        }
      </div>
      }
    </div>
  </div>
</nz-spin>
