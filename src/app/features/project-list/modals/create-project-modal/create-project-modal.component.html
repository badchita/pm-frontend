<nz-spin [nzSpinning]="isLoading" [nzTip]="SPINNER_TIP.CreatingProject">
  <form class="create-project-form" nz-form nzLayout="vertical" [formGroup]="createProjectForm">
    <nz-form-item>
      <nz-form-label class="portal-input-label">Project Name</nz-form-label>
      <nz-form-control>
        <nz-input-wrapper>
          <input
            class="portal-input-form"
            type="text"
            nz-input
            formControlName="projectName"
            nzSize="large"
            appPopoverFormValidator
          />
        </nz-input-wrapper>
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label class="portal-input-label">Descripton</nz-form-label>
      <nz-form-control>
        <nz-textarea-count [nzMaxCharacterCount]="2000">
          <textarea
            class="portal-input-textarea-form"
            formControlName="description"
            nz-input
            [nzAutosize]="{ minRows: 5, maxRows: 10 }"
            appPopoverFormValidator
          ></textarea>
        </nz-textarea-count>
      </nz-form-control>
    </nz-form-item>

    <div class="buttons-form-container">
      <button
        nz-button
        class="create-button"
        nzSize="large"
        nzShape="round"
        [nzType]="'primary'"
        [disabled]="createProjectForm.invalid"
        (click)="create()"
      >
        Create
      </button>
      <button nz-button class="reset-button" nzSize="large" nzShape="round" (click)="reset()">
        Reset
      </button>
    </div>
  </form>
</nz-spin>
