<nz-spin [nzSpinning]="isLoading" [nzTip]="SPINNER_TIP.CreatingYourAccount">
  <app-error-alert [error]="catchError"></app-error-alert>

  <nz-card>
    <h1 class="register-heading">Create Your Account</h1>

    <form nz-form [formGroup]="registerForm" class="register-form">
      <div class="user-role-segment-container">
        <nz-segmented class="user-role-segment" [nzOptions]="userRoleOptions" formControlName="role" />
      </div>
      <nz-form-label nzNoColon="true"> Name </nz-form-label>
      <nz-form-control>
        <nz-input-wrapper>
          <input type="text" nz-input formControlName="name" nzSize="large" appPopoverFormValidator />
        </nz-input-wrapper>
      </nz-form-control>
      <nz-form-label nzNoColon="true"> Email </nz-form-label>
      <nz-form-control>
        <nz-input-wrapper>
          <input type="text" nz-input formControlName="email" nzSize="large" appPopoverFormValidator />
        </nz-input-wrapper>
      </nz-form-control>
      <nz-form-label nzNoColon="true"> Password </nz-form-label>
      <nz-form-control>
        <nz-input-wrapper>
          <input nz-input formControlName="password" type="password" nzSize="large" appPopoverFormValidator />
        </nz-input-wrapper>
      </nz-form-control>
      @if (role?.value === 1) {
      <nz-form-label nzNoColon="true"> Company Name </nz-form-label>
      <nz-form-control>
        <nz-input-wrapper>
          <input type="text" nz-input formControlName="companyName" nzSize="large" appPopoverFormValidator />
        </nz-input-wrapper>
      </nz-form-control>
      }
      <button nz-button class="register-form-button" [nzType]="'primary'" nzSize="large" nzShape="round"
        (click)="register()" [disabled]="registerForm.invalid">
        Register
      </button>
      <div class="link-texts">
        <span nz-typography>
          Already have an account?
          <u>
            <a routerLink="/login"> Login Here </a>
          </u>
        </span>
      </div>
    </form>
  </nz-card>
</nz-spin>
