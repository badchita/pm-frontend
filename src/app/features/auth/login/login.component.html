<nz-card>
  <form nz-form [formGroup]="loginForm" class="login-form">
    <h1 class="login-heading">Login to Your Account</h1>
    <nz-form-item>
      <nz-form-control nzErrorTip="Please input your username!">
        <nz-input-wrapper>
          <input type="text" nz-input formControlName="email" placeholder="Email" nzSize="large" />
        </nz-input-wrapper>
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-control nzErrorTip="Please input your Password!">
        <nz-input-wrapper>
          <input nz-input formControlName="password" placeholder="Password" nzSize="large" />
        </nz-input-wrapper>
      </nz-form-control>
    </nz-form-item>
    <button nz-button class="login-form-button" [nzType]="'primary'" nzSize="large" nzShape="round">Log in</button>
    <div class="link-texts">
      <span nz-typography>
        <a href="/login" target="_blank">Forgot Password?</a>
      </span>
      <span nz-typography>
        <a href="/login" target="_blank">Register</a>
      </span>
    </div>
  </form>
</nz-card>
