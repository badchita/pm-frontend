<div class="container">
  <app-error-alert [error]="catchError"></app-error-alert>

  <div class="header">
    <span>Company List</span>
  </div>

  <div class="content">
    <app-admin-company-list-table [dataTable]="companyDataTable"
      [dataList]="companyDataTable.data.length > 0 ? companyDataTable.data : []" [loading]="isLoading"
      (onUpdateTable)="tableUpdate($event)"></app-admin-company-list-table>
  </div>
</div>
