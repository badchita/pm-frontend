<nz-spin [nzSpinning]="isLoading" [nzTip]="spinnerTip">
  <div class="container">
    <div class="header">
      <nz-tag nzColor="success">Approved</nz-tag>
    </div>

    <div class="content">
      <form nz-form nzLayout="vertical" [formGroup]="editUserForm">
        <nz-row>
          <nz-col nzSpan="12">
            <nz-form-item>
              <nz-form-label class="portal-input-label" nzRequired>Name</nz-form-label>
              <nz-form-control>
                <nz-input-wrapper>
                  <input class="portal-input-form" type="text" nz-input formControlName="name" nzSize="large"
                    appPopoverFormValidator />
                </nz-input-wrapper>
              </nz-form-control>
            </nz-form-item>
          </nz-col>
          <nz-col nzSpan="12">
            <nz-form-item>
              <nz-form-label class="portal-input-label" nzRequired>Email</nz-form-label>
              <nz-form-control>
                <nz-input-wrapper>
                  <input class="portal-input-form" type="text" nz-input formControlName="email" nzSize="large"
                    appPopoverFormValidator />
                </nz-input-wrapper>
              </nz-form-control>
            </nz-form-item>
          </nz-col>
        </nz-row>

        <nz-row>
          <nz-col nzSpan="12">
            <nz-form-item>
              <nz-form-label class="portal-input-label" nzRequired>Role</nz-form-label>
              <nz-form-control>
                <nz-select class="portal-select-form" formControlName="role" nzPlaceHolder="Select Role"
                  [nzAllowClear]="true" [nzOptions]="roleOptions" appPopoverFormValidator>
                </nz-select>
              </nz-form-control>
            </nz-form-item>
          </nz-col>
          <nz-col nzSpan="12">
            <nz-form-item>
              <nz-form-label class="portal-input-label" nzRequired>Status</nz-form-label>
              <nz-form-control>
                <nz-select class="portal-select-form" formControlName="isApproved" nzPlaceHolder="Select Status"
                  [nzAllowClear]="true" [nzOptions]="statusOptions" appPopoverFormValidator>
                </nz-select>
              </nz-form-control>
            </nz-form-item>
          </nz-col>
        </nz-row>

        <div class="buttons-form-container">
          <button nz-button class="create-button" nzSize="large" nzShape="round" [nzType]="'primary'"
            [disabled]="editUserForm.invalid && !hasChanges">
            Save
          </button>
          <button nz-button class="close-button" nzSize="large" nzShape="round">
            Close
          </button>
        </div>
      </form>
    </div>
  </div>
</nz-spin>
