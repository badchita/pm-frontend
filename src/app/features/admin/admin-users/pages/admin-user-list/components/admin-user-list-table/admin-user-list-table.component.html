<div class="table-container">
  <nz-table #table class="table" nzTableLayout="fixed" [nzFrontPagination]="false" [nzShowSizeChanger]="true"
    [nzPageSizeOptions]="[10, 20, 30, 40, 50]">
    <thead>
      <tr>
        <th nzWidth="15%" [nzSortFn]="true" id="name" nzColumnKey="name">Name</th>
        <th nzWidth="15%" [nzSortFn]="true" id="email" nzColumnKey="email">Email</th>
        <th nzWidth="15%" id="Role">Role</th>
        <th nzWidth="15%" id="isPublished" nzAlign="center">Status</th>
        <th nzWidth="15%" id="createdAt" nzAlign="center" [nzSortFn]="true" nzColumnKey="createdAt">Date Joined</th>
        <th nzWidth="10%" id="actions" nzAlign="center">Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (data of table.data; track data.id) {
      <tr>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td class="table-action-buttons" nzAlign="center">
          <button class="edit-button" nz-button nzType="link">
            <nz-icon nzType="edit" nzTheme="outline" />
          </button>
          <nz-divider nzType="vertical"></nz-divider>
          <button class="delete-button" nz-button nzType="link" nzDanger>
            <nz-icon nzType="delete" nzTheme="outline" />
          </button>
        </td>
      </tr>
      }
    </tbody>
  </nz-table>
</div>
