<div class="container">
  <app-error-alert [error]="catchError"></app-error-alert>

  <div class="header">
    <span>User List</span>
  </div>

  <div class="content">
    <app-admin-user-list-table [dataTable]="userDataTable"
      [dataList]="userDataTable.data.length > 0 ? userDataTable.data : []" [loading]="isLoading"
      (onUpdateTable)="tableUpdate($event)"></app-admin-user-list-table>
  </div>
</div>
