<div class="container">
  <app-error-alert [error]="catchError"></app-error-alert>

  <div class="header">
    <span>Project List</span>
  </div>

  <div class="content">
    <app-admin-project-list-table [dataTable]="projectDataTable"
      [dataList]="projectDataTable.data.length > 0 ? projectDataTable.data : []" [loading]="isLoading"
      (onUpdateTable)="tableUpdate($event)"></app-admin-project-list-table>
  </div>
</div>
