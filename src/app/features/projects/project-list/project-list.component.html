<div class="container">
  <div class="header">
    <span>Project List</span>
    <button nz-button nzShape="round" nzType="primary" (click)="addNewProject()">
      Add New Project
    </button>
  </div>

  <div class="content">
    <app-project-list-table
      [dataTable]="projectDataTable"
      [dataList]="projectDataTable.data.length > 0 ? projectDataTable.data : []"
      [isLoading]="busy"
      (onUpdateTable)="tableUpdate($event)"
    ></app-project-list-table>
  </div>
</div>
