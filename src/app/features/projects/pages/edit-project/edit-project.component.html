<div class="container">
  <div class="header">
    <span>{{ projectName }}: {{ projectIdNumber }}</span>
    @if (isPublished === 'Y') {
    <nz-tag nzColor="success">Active</nz-tag>
    } @else {
    <nz-tag nzColor="default">In Active</nz-tag>
    }
  </div>

  <div class="content">
    <app-project-form (onGetProject)="getProject($event)"></app-project-form>
  </div>
</div>
