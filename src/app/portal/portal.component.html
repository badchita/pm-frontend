<nz-layout class="layout-container">
  <nz-header class="header">
    <app-header></app-header>
  </nz-header>

  <nz-layout>
    <nz-sider nzWidth="256px" nzTheme="light" class="side-bar">
      <ul nz-menu class="sider-menu">
        @for (nav of navItem; track nav) {
        <li nz-menu-item class="sider-menu-item" (click)="navigate(nav.route)">
          <nz-icon [nzType]="nav.icon" nzTheme="outline" />
          <span>{{ nav.title }}</span>
        </li>
        }
      </ul>
    </nz-sider>
    <nz-layout class="inner-layout">
      <nz-content class="content">
        <router-outlet></router-outlet>
      </nz-content>
    </nz-layout>
  </nz-layout>
</nz-layout>
