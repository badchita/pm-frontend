<nz-layout class="layout-container">
  <nz-header class="header">
    <app-header></app-header>
  </nz-header>

  <nz-layout>
    <nz-sider nzWidth="256px" nzTheme="light" class="side-bar" [(nzCollapsed)]="isCollapsed">
      <div class="sidebar-items">
        <ul nz-menu class="sidebar-menu" nzMode="inline">
          @for (nav of navItems; track nav.route) {
          @if (nav.child?.length) {
          <li nz-submenu [nzTitle]="nav.title" [nzIcon]="nav.icon" [nzOpen]="currentRoute.includes(nav.route)">
            <ul>
              @for (child of nav.child; track child.route) {
              <li nz-menu-item [nzSelected]="currentRoute.includes(child.route)" (click)="navigate(child.route)">
                {{ child.title }}
              </li>
              }
            </ul>
          </li>
          }
          @else {
          <li nz-menu-item (click)="navigate(nav.route)" [nzSelected]="currentRoute.includes(nav.route)">
            <nz-icon [nzType]="nav.icon" />
            <span>{{ nav.title }}</span>
          </li>
          }
          }

          <li class="admin-menu-item" nz-menu-item (click)="navigate(adminNavItem.route)"
            [nzSelected]="currentRoute.includes(adminNavItem.route)">
            <nz-icon [nzType]="adminNavItem.icon" />
            <span>{{ adminNavItem.title }}</span>
          </li>
        </ul>


        <div class="border-line" [ngClass]="isCollapsed ? 'border-line-collapse-close' : ''"></div>
        <div class="collapse-button-container" [ngClass]="isCollapsed ? 'collapse-close' : ''">
          <button nz-button nzType="primary" (click)="isCollapsed = !isCollapsed" nzSize="small">
            <nz-icon [nzType]="isCollapsed ? 'arrow-right' : 'arrow-left'" />
          </button>
        </div>
      </div>
    </nz-sider>
    <nz-layout class="inner-layout">
      <nz-content class="content" [ngClass]="{ 'content-white': isWhiteBackground }">
        <router-outlet></router-outlet>
      </nz-content>
    </nz-layout>
  </nz-layout>
</nz-layout>
